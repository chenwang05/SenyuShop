# 森屿商店配置
page-size: 24
max-listings-per-player: 10
expire-days: 7

# 拍卖行成交税:按卖家成交时的余额档收税,税金直接销毁(不进任何账户),官方商店不收税。
# 格式 "余额上限:百分比",从上到下取第一个 余额<=上限 的档位;上限写 0 表示不设上限(放 last)。
tax-enabled: true
tax-brackets:
  - "10000:1"
  - "100000:2"
  - "250000:3"
  - "500000:4"
  - "1000000:5"
  - "2500000:10"
  - "5000000:12"
  - "0:20"
